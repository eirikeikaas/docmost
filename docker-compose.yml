services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmost-fork:local
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      # Secrets come from .env (git-ignored); see .env.example.
      APP_SECRET: '${DOCKER_APP_SECRET:?Set DOCKER_APP_SECRET in .env}'
      DATABASE_URL: 'postgresql://docmost:${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: '${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}'
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
